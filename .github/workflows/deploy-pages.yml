name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Build static site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_EXPORT: "1"
        run: bun run build
      - name: Locate static output
        id: out
        run: |
          if [ -f dist/client/index.html ]; then DIR=dist/client
          elif [ -f .output/public/index.html ]; then DIR=.output/public
          else echo "No index.html found in build output"; ls -R dist .output 2>/dev/null | head -50; exit 1; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Prepare for GitHub Pages
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          touch "$DIR/.nojekyll"
          cp "$DIR/index.html" "$DIR/404.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
